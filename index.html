<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五分鐘計時器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&family=Noto+Sans+TC:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">

<main class="card" id="card">
  <p class="eyebrow">5 MINUTE TIMER</p>
  <div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="54"></circle>
      <circle class="arc" id="arc" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="0"></circle>
    </svg>
    <div class="time" id="time" role="timer" aria-live="off">05:00</div>
  </div>
  <div class="controls">
    <button class="primary" id="toggle">開始</button>
    <button id="reset">重設</button>
  </div>
  <p class="hint">空白鍵：開始／暫停　·　R：重設</p>
</main>

<script>
  const TOTAL = 5 * 60 * 1000, CIRC = 2 * Math.PI * 54;
  const card = document.getElementById("card"), arc = document.getElementById("arc");
  const timeEl = document.getElementById("time"), toggle = document.getElementById("toggle");
  const resetBtn = document.getElementById("reset");
  let remaining = TOTAL, endAt = null, tick = null, lastSec = null;

  const left = () => endAt ? Math.max(0, endAt - Date.now()) : remaining;

  // 重新觸發一次性動畫：先移除 class，強制重排後再加回來
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function render() {
    const ms = left(), s = Math.ceil(ms / 1000);
    timeEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    arc.style.strokeDasharray = CIRC;
    arc.style.strokeDashoffset = CIRC * (1 - ms / TOTAL);
    card.classList.toggle("urgent", ms <= 30000 && ms > 0);
    // 最後 10 秒每跳一秒，數字彈一下
    if (s !== lastSec && endAt && ms <= 10000 && ms > 0) replay(timeEl, "tick");
    lastSec = s;
    if (endAt && ms === 0) stop(true);
  }

  function setState(name) {
    card.classList.remove("running", "paused", "done");
    if (name) card.classList.add(name);
  }

  function start() {
    endAt = Date.now() + remaining;
    tick = setInterval(render, 100);
    toggle.textContent = "暫停";
    timeEl.setAttribute("aria-live", "off");
    setState("running");
    render();
  }

  function stop(done) {
    remaining = done ? 0 : left();
    endAt = null;
    clearInterval(tick); tick = null;
    toggle.textContent = done ? "時間到" : "繼續";
    setState(done ? "done" : "paused");
    if (done) {
      card.classList.remove("urgent");
      timeEl.setAttribute("aria-live", "assertive");
      beep();
    }
    render();
  }

  function reset() {
    clearInterval(tick); tick = null; endAt = null; remaining = TOTAL; lastSec = null;
    toggle.textContent = "開始";
    card.classList.remove("urgent");
    setState(null);
    render();
  }

  function beep() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(0.18, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.2);
      o.start(); o.stop(ac.currentTime + 1.2);
    } catch (e) { /* 無音訊權限時靜音結束 */ }
  }

  toggle.addEventListener("click", () => {
    replay(toggle, "pressed");
    if (endAt) stop(false);
    else if (remaining > 0) start();
    else reset();
  });
  resetBtn.addEventListener("click", () => { replay(resetBtn, "pressed"); reset(); });
  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); toggle.click(); }
    if (e.key === "r" || e.key === "R") resetBtn.click();
  });

  render();
</script>
